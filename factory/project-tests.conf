# factory/project-tests.conf -- die Produkttests dieses Repositories.
#
# WOFÜR DIESE DATEI DA IST (Audit-Befund F-21)
# -------------------------------------------
# Die Factory kennt das Testframework des Produkts NICHT. Sie sucht nicht nach
# Testdateien und rät nicht, welche Sprache das Projekt benutzt. Sie führt
# genau die Kommandos aus, die hier stehen.
#
# Vorher war das anders: die Factory suchte `app/**/test_*.py` und führte sie
# mit unittest aus. Für ein Go-, Node-, Java- oder Multi-Service-Projekt fand
# sie nichts -- und meldete Exit 0. Die einzige Stelle, an der die Factory
# fragt „funktioniert das Produkt noch?", antwortete „ja", ohne je einen
# Produkttest ausgeführt zu haben.
#
# WARUM DIESE DATEI CONTROL PLANE IST
# -----------------------------------
# Sie steht in `factory/control-plane.sha256`. Wer bestimmen kann, welche
# Produkttests als gültige Verification gelten, darf das nicht während normaler
# Finding-Arbeit tun -- sonst wäre eine rote Testsuite zum Verschwinden zu
# bringen, ohne eine einzige Testdatei anzufassen. Diese Datei zu ändern ist
# ein FACTORY_CHANGE und passiert einmalig beim Onboarding.
#
# FORMAT
# ------
#   mode: template | real-project
#
#   [suite: <name>]
#   command: <ein einziges Kommando>
#   workdir: <Pfad relativ zur Repo-Wurzel, optional>
#
# Kommandos werden OHNE Shell ausgeführt: sie werden mit shlex zerlegt (ein
# Tokenizer, der nichts ausführt) und als Argumentliste an subprocess
# übergeben. Shell-Metazeichen (| ; & $ ` > <) werden abgelehnt statt still
# als gewöhnliche Argumente durchgereicht. Wer eine Pipeline braucht, legt sie
# in ein Skript des Projekts und ruft dieses Skript hier als ein Kommando auf.
#
# Jede deklarierte Suite wird ausgeführt. Ein Exit-Code ungleich 0 einer
# einzigen Suite führt zum Gesamtfehler; eine spätere rote Suite wird von einer
# früheren grünen nie überdeckt.
#
# BEISPIELE FÜR EIN REALES PROJEKT (hier bewusst auskommentiert)
# --------------------------------------------------------------
#   mode: real-project
#
#   [suite: go-unit]
#   command: go test ./...
#
#   [suite: frontend]
#   command: npm test --silent
#   workdir: web
#
#   [suite: python]
#   command: pytest -q
#
#   [suite: maven]
#   command: mvn -B test
#   workdir: service
#
# ZUSTAND DIESES REPOSITORIES
# ---------------------------
# Dies ist die reine Factory-Vorlage ohne Produktcode. `mode: template` ist
# deshalb korrekt und führt zu TEMPLATE_WITHOUT_PRODUCT -- dem einzigen
# Zustand, in dem null Produkttests als bestanden gelten.
#
# Sobald in einem echten Projekt getrackte Dateien außerhalb der Factory-Pfade
# existieren, meldet der Adapter REAL_PROJECT_WITHOUT_TEST_CONFIGURATION und
# blockiert (Exit 2), bis hier mindestens eine Suite eingetragen ist. Das ist
# beabsichtigt: eine nicht konfigurierte Testpflicht ist keine erfüllte
# Testpflicht.

mode: template
