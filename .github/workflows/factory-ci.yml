name: Factory CI

# Runs the exact same canonical factory checks used locally and by the
# Claude Code Stop hook (see factory/README.md), independently of any
# Claude session. No Claude/Anthropic API, no secrets, no deployments.
#
# Deliberately no branch filter: this workflow is part of a transferable
# template and must not assume the default branch is called "main". Every
# push and every pull request is checked, whatever the branches are named.
#
# The job id below (factory-checks) is the name to configure as the
# Required Status Check on the protected default branch -- see
# factory/ONBOARDING.md. Without that, CI checks but blocks no merge.
#
# Note on what a green run here does and does not prove: this workflow is
# checked out from the pull request's own head, so a branch that changed a
# guard would be checked by the changed guard. That is why the canonical
# runner also verifies the control plane against factory/control-plane.sha256
# (factory/guards/validate-control-plane.py) -- a branch that touches the
# guards, scripts, hooks, rules or this workflow fails unless the manifest
# was deliberately re-stamped, which is a visible FACTORY_CHANGE.

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  factory-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      # No external Python packages are installed: the factory guards and
      # tests are pure standard-library Python by design.

      - name: Run canonical factory checks
        run: python3 factory/guards/run-factory-checks.py

      - name: Run project test suite
        run: python3 factory/guards/run-project-tests.py

      - name: Run factory guard tests
        run: python3 -m unittest factory.guards.test_validate_finding factory.guards.test_validate_review factory.guards.test_run_factory_checks factory.guards.test_create_finding_worktree factory.guards.test_factory_preflight factory.guards.test_trust_core factory.guards.test_control_plane factory.guards.test_gh_evidence -v

      - name: Run Stop hook tests
        run: python3 .claude/hooks/test_stop_validate_findings.py -v

      - name: Run SubagentStop review hook tests
        run: python3 .claude/hooks/test_subagentstop_write_review.py -v
